name: Lint charts

on:
  push:
    branches: [main, dso, dso-auto]
    paths:
      - 'packages/**'
      - 'init.yaml'
      - 'scripts/**'
      - '.github/workflows/chart.yaml'
  pull_request:
    paths:
      - 'packages/**'
      - 'init.yaml'
      - 'scripts/**'
      - '.github/workflows/chart.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Helm lint + template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint packages/apps/ieee9-grid
        run: helm lint packages/apps/ieee9-grid

      - name: Lint packages/apps/ieee9-zone
        run: helm lint packages/apps/ieee9-zone

      - name: Lint packages/apps/ieee9-zone-auto
        run: helm lint packages/apps/ieee9-zone-auto

      - name: Lint packages/core/platform
        run: helm lint packages/core/platform

      - name: Template packages/apps/ieee9-grid (default)
        run: helm template test packages/apps/ieee9-grid > /dev/null

      - name: Template packages/apps/ieee9-grid (ingress)
        run: |
          helm template test packages/apps/ieee9-grid \
            --set ingressEnabled=true \
            --set ingressHost=ieee9.example.com \
            > /dev/null

      - name: Template packages/apps/ieee9-zone (diesel)
        run: |
          helm template test packages/apps/ieee9-zone \
            --set mode=diesel > /dev/null

      - name: Template packages/apps/ieee9-zone (dso)
        run: |
          helm template test packages/apps/ieee9-zone \
            --set mode=dso \
            --set modelRepoUrl=https://github.com/example/model.git \
            > /dev/null

      - name: Template packages/apps/ieee9-zone-auto
        run: |
          helm template test packages/apps/ieee9-zone-auto \
            --set modelRepoOwner=exampleuser \
            > /dev/null

      - name: Template packages/core/platform
        run: helm template test packages/core/platform > /dev/null

      - name: Validate init.yaml
        run: |
          python3 -c "import yaml; list(yaml.safe_load_all(open('init.yaml')))"
