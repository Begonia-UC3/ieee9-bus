# -- Registry containing per-service images
image:
  registry: ghcr.io
  # -- Base repository; each service image is at `{registry}/{repository}/<service>`
  repository: begonia-uc3/ieee9-bus
  # -- Image tag; defaults to chart appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

# -- Extra image pull secrets
imagePullSecrets: []

# -- Override chart name used by templates
nameOverride: ""
# -- Override fully-qualified release name
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Pod-level security context applied to all services
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context applied to all services
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# -- Per-service configuration. Each key becomes a Deployment + Service.
services:
  grid-central:
    enabled: true
    replicas: 1
    port: 8000
    probePath: /api/grid-state
    env:
      PYTHONUNBUFFERED: "1"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  diesel-gen:
    enabled: true
    replicas: 1
    port: 8000
    probePath: /api/status
    env:
      PYTHONUNBUFFERED: "1"
      GRID_CENTRAL_URL: "http://grid-central:8000"
      TICK_INTERVAL: "1.0"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  battery:
    enabled: true
    replicas: 1
    port: 8000
    probePath: /api/status
    env:
      PYTHONUNBUFFERED: "1"
      GRID_CENTRAL_URL: "http://grid-central:8000"
      TICK_INTERVAL: "1.0"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  datacenter:
    enabled: true
    replicas: 1
    port: 8000
    probePath: /api/status
    env:
      PYTHONUNBUFFERED: "1"
      GRID_CENTRAL_URL: "http://grid-central:8000"
      TICK_INTERVAL: "1.0"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

ingress:
  # -- Expose services over HTTP ingress
  enabled: false
  className: ""
  annotations: {}
  # -- Each entry maps a host to a service
  hosts:
    - host: ieee9.local
      paths:
        - path: /
          pathType: Prefix
          service: grid-central
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
