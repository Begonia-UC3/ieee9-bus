# Cross-tenant CiliumNetworkPolicy pair for the four student tenants.
# Each student-group DSO pod (label apps.cozystack.io/application.kind=
# Ieee9Zone) needs egress to grid-central in tenant-root, and grid-
# central in turn needs to accept ingress from any of the four student
# namespaces.
#
# Egress side cannot be collapsed — Cilium scopes endpointSelector to
# the policy's own namespace, so we need one CNP per student tenant.
# Ingress side is one CNP in tenant-root with a fromEndpoints entry
# per tenant.
#
# Apply once per cluster after tenants.yaml has provisioned the
# namespaces:
#   kubectl apply -f cnps.yaml
#
# (The existing deploy/stage2/cnp-cross-tenant.yaml stays in place;
# it serves the tenant-dsos sandbox and is independent of this pair.)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dso-to-grid-central-tenant-root
  namespace: tenant-group1
spec:
  endpointSelector:
    matchLabels:
      apps.cozystack.io/application.kind: Ieee9Zone
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-root
        app.kubernetes.io/name: grid-central
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dso-to-grid-central-tenant-root
  namespace: tenant-group2
spec:
  endpointSelector:
    matchLabels:
      apps.cozystack.io/application.kind: Ieee9Zone
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-root
        app.kubernetes.io/name: grid-central
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dso-to-grid-central-tenant-root
  namespace: tenant-group3
spec:
  endpointSelector:
    matchLabels:
      apps.cozystack.io/application.kind: Ieee9Zone
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-root
        app.kubernetes.io/name: grid-central
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dso-to-grid-central-tenant-root
  namespace: tenant-group4
spec:
  endpointSelector:
    matchLabels:
      apps.cozystack.io/application.kind: Ieee9Zone
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-root
        app.kubernetes.io/name: grid-central
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP
---
# Single ingress CNP in tenant-root accepting from all four student
# tenants. Each fromEndpoints entry is a separate selector — Cilium
# OR-es them. (Cannot use a single namespace selector matching all
# four because the namespace labels are not uniform.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-from-classroom-students-to-grid-central
  namespace: tenant-root
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grid-central
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-group1
        apps.cozystack.io/application.kind: Ieee9Zone
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-group2
        apps.cozystack.io/application.kind: Ieee9Zone
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-group3
        apps.cozystack.io/application.kind: Ieee9Zone
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: tenant-group4
        apps.cozystack.io/application.kind: Ieee9Zone
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP
