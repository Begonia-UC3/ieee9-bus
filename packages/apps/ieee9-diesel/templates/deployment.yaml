{{- $tag := include "ieee9-diesel.imageTag" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diesel-gen
  labels:
    {{- include "ieee9-diesel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ieee9-diesel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ieee9-diesel.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diesel-gen
          image: "ghcr.io/begonia-uc3/ieee9-bus/diesel-gen:{{ $tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GRID_CENTRAL_URL
              value: {{ .Values.gridCentralUrl | quote }}
            - name: TICK_INTERVAL
              value: {{ .Values.tickInterval | quote }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
