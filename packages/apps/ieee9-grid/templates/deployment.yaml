{{- $tag := include "ieee9-grid.imageTag" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-central
  labels:
    {{- include "ieee9-grid.labels" (dict "ctx" . "component" "grid-central") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ieee9-grid.selectorLabels" (dict "ctx" . "component" "grid-central") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ieee9-grid.selectorLabels" (dict "ctx" . "component" "grid-central") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grid-central
          image: "ghcr.io/begonia-uc3/ieee9-bus/grid-central:{{ $tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/grid-state
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/grid-state
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
