{{- $ingresses := dict
  "grid-central" (dict "enabled" .Values.ingressEnabled       "host" .Values.ingressHost           "suffix" "")
  "battery"      (dict "enabled" .Values.batteryIngressEnabled "host" .Values.batteryIngressHost   "suffix" "-battery")
  "datacenter"   (dict "enabled" .Values.datacenterIngressEnabled "host" .Values.datacenterIngressHost "suffix" "-datacenter")
-}}
{{- range $svc, $cfg := $ingresses }}
{{- if $cfg.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}{{ $cfg.suffix }}
  labels:
    {{- include "ieee9-grid.labels" (dict "ctx" $ "component" $svc) | nindent 4 }}
  {{- if $.Values.tlsEnabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.tlsClusterIssuer | quote }}
    {{- with $.Values.ingressClassName }}
    acme.cert-manager.io/http01-ingress-class: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with $.Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $.Values.tlsEnabled }}
  tls:
    - hosts:
        - {{ $cfg.host | quote }}
      secretName: {{ $.Release.Name }}{{ $cfg.suffix }}-tls
  {{- end }}
  rules:
    - host: {{ $cfg.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
{{- end }}
{{- end }}
