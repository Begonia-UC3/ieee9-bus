{{- range $component := (list "grid-central" "battery" "datacenter") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}
  labels:
    {{- include "ieee9-grid.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ieee9-grid.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
