## @section Image

## @param {string} imageTag="" - Override image tag for all services. Defaults to the chart appVersion.
imageTag: ""

## @section Workload

## @param {int} replicas=1 - Replica count applied to every service.
replicas: 1

## @section Ingress

## @param {boolean} ingressEnabled=false - Expose grid-central via Ingress.
ingressEnabled: false

## @param {string} ingressHost="ieee9.example.com" - Ingress host when enabled.
ingressHost: "ieee9.example.com"

## @param {string} ingressClassName="" - Optional IngressClass name.
ingressClassName: ""

## @param {boolean} tlsEnabled=true - Issue an LE certificate via cert-manager when ingress is enabled.
tlsEnabled: true

## @param {string} tlsClusterIssuer="letsencrypt-prod" - cert-manager ClusterIssuer used for the certificate.
tlsClusterIssuer: "letsencrypt-prod"

## @param {boolean} batteryIngressEnabled=false - Expose battery UI via Ingress.
batteryIngressEnabled: false

## @param {string} batteryIngressHost="battery.example.com" - Ingress host for battery when enabled.
batteryIngressHost: "battery.example.com"

## @param {boolean} datacenterIngressEnabled=false - Expose datacenter UI via Ingress.
datacenterIngressEnabled: false

## @param {string} datacenterIngressHost="datacenter.example.com" - Ingress host for datacenter when enabled.
datacenterIngressHost: "datacenter.example.com"
