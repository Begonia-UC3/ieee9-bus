{{- $parentNs := include "ieee9ZoneAuto.parentNamespace" . -}}
{{- $ns := include "ieee9ZoneAuto.namespace" . -}}
# Pre-install Job: wait for Cozystack to provision `tenant-dso-N` (created
# asynchronously from the Tenant CR), then copy the PAT Secret from
# cozy-system into it so the DSO pod's init container and git-sync sidecar
# can mount it.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ $parentNs }}
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "ieee9ZoneAuto.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-bootstrap
      restartPolicy: Never
      containers:
        - name: copy
          image: alpine/k8s:1.30.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for namespace {{ $ns }} (provisioned by Cozystack from the Tenant CR)..."
              for i in $(seq 1 60); do
                if kubectl get namespace {{ $ns }} >/dev/null 2>&1; then
                  echo "Namespace {{ $ns }} exists."
                  break
                fi
                sleep 3
              done
              kubectl get namespace {{ $ns }}
              echo "Copying Secret {{ .Values.patSecretNamespace }}/{{ .Values.patSecretName }} -> {{ $ns }}/github-pat"
              kubectl get secret {{ .Values.patSecretName }} -n {{ .Values.patSecretNamespace }} -o json \
                | kubectl create secret generic github-pat \
                    -n {{ $ns }} \
                    --from-literal=username="$(kubectl get secret {{ .Values.patSecretName }} -n {{ .Values.patSecretNamespace }} -o jsonpath='{.data.username}' | base64 -d)" \
                    --from-literal=token="$(kubectl get secret {{ .Values.patSecretName }} -n {{ .Values.patSecretNamespace }} -o jsonpath='{.data.token}' | base64 -d)" \
                    --dry-run=client -o yaml \
                | kubectl apply -n {{ $ns }} -f -
              echo "done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
