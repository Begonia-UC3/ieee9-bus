{{- if .Values.ingressEnabled }}
{{- $ns := include "ieee9ZoneAuto.namespace" . -}}
{{- $host := include "ieee9ZoneAuto.ingressHost" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dso
  namespace: {{ $ns }}
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
  {{- if .Values.tlsEnabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tlsClusterIssuer | quote }}
    {{- with .Values.ingressClassName }}
    acme.cert-manager.io/http01-ingress-class: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.tlsEnabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: dso-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dso
                port:
                  name: http
{{- end }}
