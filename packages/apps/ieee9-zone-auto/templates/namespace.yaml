{{- include "ieee9ZoneAuto.validate" . -}}
{{- $n := include "ieee9ZoneAuto.instanceNumber" . -}}
{{- $tenantName := include "ieee9ZoneAuto.tenantName" . -}}
{{- $parentNs := include "ieee9ZoneAuto.parentNamespace" . -}}
# Optional: create the parent tenant idempotently if it doesn't exist.
# Child of `root` (which Cozystack hosts in namespace `tenant-root`).
{{- if .Values.autoCreateParentTenant }}
apiVersion: apps.cozystack.io/v1alpha1
kind: Tenant
metadata:
  name: {{ .Values.parentTenant }}
  namespace: tenant-root
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
spec: {}
---
{{- end }}
# Per-DSO child tenant. Cozystack provisions namespace `tenant-dso-N`
# from this CR. Regular (non-hook) Helm resource so `helm uninstall`
# deletes the Tenant, which triggers Cozystack to tear down the
# namespace and everything in it.
apiVersion: apps.cozystack.io/v1alpha1
kind: Tenant
metadata:
  name: {{ $tenantName }}
  namespace: {{ $parentNs }}
  labels:
    ieee9-zone-auto/index: {{ $n | quote }}
    ieee9-zone-auto/owner: {{ include "ieee9ZoneAuto.owner" . | quote }}
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
spec: {}
