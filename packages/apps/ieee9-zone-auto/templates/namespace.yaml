{{- include "ieee9ZoneAuto.validate" . -}}
{{- $n := include "ieee9ZoneAuto.instanceNumber" . -}}
{{- $tenantName := include "ieee9ZoneAuto.tenantName" . -}}
{{- $parentNs := include "ieee9ZoneAuto.parentNamespace" . -}}
# Optional: create the parent tenant idempotently if it doesn't exist.
# Child of `root` (which Cozystack hosts in namespace `tenant-root`).
{{- if .Values.autoCreateParentTenant }}
apiVersion: apps.cozystack.io/v1alpha1
kind: Tenant
metadata:
  name: {{ .Values.parentTenant }}
  namespace: tenant-root
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
spec: {}
---
{{- end }}
# Per-DSO child tenant. Must exist BEFORE the pre-install bootstrap Job
# runs (the Job waits for the namespace Cozystack provisions from this
# CR). Made a pre-install hook with a weight lower than the RBAC/Job
# hooks so it applies first. `resource-policy: keep` prevents Helm from
# deleting the Tenant on uninstall — tear it down manually (or via a
# future post-delete hook).
apiVersion: apps.cozystack.io/v1alpha1
kind: Tenant
metadata:
  name: {{ $tenantName }}
  namespace: {{ $parentNs }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/resource-policy": keep
  labels:
    ieee9-zone-auto/owner: {{ include "ieee9ZoneAuto.owner" . | quote }}
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
spec: {}
