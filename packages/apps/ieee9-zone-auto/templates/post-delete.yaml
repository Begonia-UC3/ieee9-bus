{{- $ns := include "ieee9ZoneAuto.namespace" . -}}
# Post-delete Job: tear down the per-instance namespace when the
# HelmRelease is uninstalled. Runs in a neutral namespace (the release's
# own namespace) because the target namespace is what we're deleting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-teardown
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-teardown
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-teardown
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-teardown
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-teardown
      restartPolicy: Never
      containers:
        - name: teardown
          image: bitnami/kubectl:1.30
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Deleting namespace {{ $ns }} and its cluster-scoped RBAC..."
              kubectl delete namespace {{ $ns }} --ignore-not-found --wait=false
              kubectl delete clusterrole {{ .Release.Name }}-dso-bootstrap-read --ignore-not-found
              kubectl delete clusterrolebinding {{ .Release.Name }}-dso-bootstrap-read --ignore-not-found
              echo "done"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
