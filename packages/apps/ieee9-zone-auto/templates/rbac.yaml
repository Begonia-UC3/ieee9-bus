{{- $parentNs := include "ieee9ZoneAuto.parentNamespace" . -}}
{{- $ns := include "ieee9ZoneAuto.namespace" . -}}
# RBAC for the bootstrap Job. Lives in the PARENT tenant's namespace
# (the child namespace doesn't exist yet when the pre-install hook runs —
# Cozystack provisions it asynchronously after the Tenant CR lands).
# The Job waits for the child namespace, then copies the PAT Secret into it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ $parentNs }}
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
# Read PAT Secret in cozy-system, watch Namespaces cluster-wide (to detect
# when tenant-dso-N appears), write Secret into tenant-dso-N.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    {{- include "ieee9ZoneAuto.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-bootstrap
    namespace: {{ $parentNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-bootstrap
