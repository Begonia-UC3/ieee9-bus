{{- $name := include "ieee9-zone.workloadName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ieee9-zone.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ieee9-zone.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
