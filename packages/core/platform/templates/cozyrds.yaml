apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: ieee9-zone
spec:
  application:
    kind: Ieee9Zone
    plural: ieee9zones
    singular: ieee9-zone
    openAPISchema: '{"title":"IEEE 9-Bus Zone","type":"object","properties":{"mode":{"description":"Zone type.","type":"string","enum":["diesel","dso"],"default":"diesel"},"imageTag":{"description":"Override image tag. Defaults to the chart appVersion.","type":"string","default":""},"replicas":{"description":"Replica count.","type":"integer","minimum":0,"default":1},"gridCentralUrl":{"description":"Base URL of upstream grid-central (in-namespace by default).","type":"string","default":"http://grid-central:8000"},"tickInterval":{"description":"Seconds between telemetry ticks.","type":"string","default":"1.0"},"modelRepoUrl":{"description":"HTTPS URL of a public Git repo containing the DSO grid model JSON. Required when mode=dso.","type":"string","default":""},"modelRepoBranch":{"description":"Branch to track for the model repo.","type":"string","default":"main"},"modelPath":{"description":"Path to the model JSON inside the repo.","type":"string","default":"model.json"},"modelSyncIntervalSeconds":{"description":"Poll interval for git-sync (seconds).","type":"integer","minimum":5,"default":30},"assetId":{"description":"Override the external-tie asset_id (defaults to the value from the model JSON).","type":"string","default":""},"upstreamBusId":{"description":"Outer-grid bus ID whose voltage DSO should use as its slack V_setpoint. Empty disables the closed loop.","type":"string","default":"6"},"upstreamPollSeconds":{"description":"Interval for polling upstream grid-central state.","type":"integer","minimum":1,"default":5},"ingressEnabled":{"description":"Expose the zone HTTP UI via Ingress.","type":"boolean","default":false},"ingressHost":{"description":"Ingress host when enabled.","type":"string","default":"zone.example.com"},"ingressClassName":{"description":"Optional IngressClass name.","type":"string","default":""},"tlsEnabled":{"description":"Issue an LE certificate via cert-manager when ingress is enabled.","type":"boolean","default":true},"tlsClusterIssuer":{"description":"cert-manager ClusterIssuer used for the certificate.","type":"string","default":"letsencrypt-prod"}}}'
  release:
    chartRef:
      kind: HelmChart
      name: ieee9-bus-ieee9-zone
      namespace: cozy-public
    labels:
      cozystack.io/ui: "true"
    prefix: zone-
  dashboard:
    category: Simulation
    singular: IEEE 9-Bus Zone
    plural: IEEE 9-Bus Zones
    description: External IEEE 9-Bus asset — one CR per asset role. Modes - diesel (single generator on bus 2) or dso (nested grid on bus 6, model pulled from Git via git-sync).
    tags:
      - simulation
      - power-grid
      - ieee9
